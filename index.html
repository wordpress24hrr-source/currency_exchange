<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Currency Converter</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <button class="toggle-switch" type="button" aria-pressed="false">🌙 Dark Mode</button>

    <div class="container">
        <p class="eyebrow">Global money, simplified</p>
        <h2>Live Currency Converter</h2>
        <label for="amount">Amount to convert</label>
        <input type="number" id="amount" value="1">

        <div class="dropdowns">
            <div>
                <label for="fromCurrency">From</label>
                <select id="fromCurrency"></select>
            </div>
            <span class="swap-icon" aria-hidden="true">⇆</span>
            <div>
                <label for="toCurrency">To</label>
                <select id="toCurrency"></select>
            </div>
        </div>

        <p id="exchangeRate">Fetching latest rates...</p>
        <p class="loading">Loading...</p>
    </div>

    <script src="js/app.js"></script>

</body>
</html>
